<div class="conteneur">
  <div class="entete">
    <h1>Participants</h1>
    <a routerLink="/participants/creer" class="bouton-lien">+ Ajouter un participant</a>
  </div>

  @if (erreur()) {
    <p class="message-erreur">{{ erreur() }}</p>
  }

  <p-table [value]="participants()" [loading]="chargement()" [paginator]="true" [rows]="10"
           styleClass="p-datatable-sm" [rowHover]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Email</th>
        <th>Organisation</th>
        <th>Téléphone</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-participant>
      <tr>
        <td>{{ participant.nom }}</td>
        <td>{{ participant.prenom }}</td>
        <td>{{ participant.email }}</td>
        <td>{{ participant.organisation || '-' }}</td>
        <td>{{ participant.telephone || '-' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="message-vide">Aucun participant trouvé.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
