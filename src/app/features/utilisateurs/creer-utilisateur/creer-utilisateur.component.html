<div class="page-etroite formulaire-carte">
  <div class="entete-page">
    <div>
      <p class="eyebrow">Utilisateurs</p>
      <h1>Créer un utilisateur</h1>
    </div>
  </div>

  <form [formGroup]="formulaire" (ngSubmit)="soumettre()" class="carte">
    <label for="nom">Nom</label>
    <input id="nom" type="text" formControlName="nom" />

    <label for="prenom">Prénom</label>
    <input id="prenom" type="text" formControlName="prenom" />

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" placeholder="prenom.nom@asn-technology.bf" />

    <label for="motDePasse">Mot de passe</label>
    <input id="motDePasse" type="password" formControlName="motDePasse" autocomplete="new-password" />
    @if (formulaire.get('motDePasse')?.invalid && formulaire.get('motDePasse')?.touched) {
      <span class="erreur-champ">8 caractères minimum</span>
    }

    <label for="role">Rôle</label>
    <select id="role" formControlName="role">
      <option value="" disabled>Sélectionner un rôle</option>
      @for (role of rolesDisponibles; track role) {
        <option [value]="role">{{ role }}</option>
      }
    </select>

    @if (messageErreur()) {
      <p class="message-erreur">{{ messageErreur() }}</p>
    }

    <div class="actions-formulaire">
      <button type="submit" [disabled]="enCours()">
        {{ enCours() ? 'Création…' : "Créer l'utilisateur" }}
      </button>
      <a routerLink="/utilisateurs" class="lien-annuler">Annuler</a>
    </div>
  </form>
</div>
